<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tugas 6 Desain web - Layout RWD Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="icon" href="assets/img/logo.png" />
  </head>
  <body>
    <div class="container-main py-3">
      <header>
        <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#mainCarousel"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              data-bs-target="#mainCarousel"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              data-bs-target="#mainCarousel"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <img
                src="assets/img/1.png"
                class="d-block w-100"
                alt="Banner 1"
              />
            </div>
            <div class="carousel-item">
              <img
                src="assets/img/2.png"
                class="d-block w-100"
                alt="Banner 2"
              />
            </div>
            <div class="carousel-item">
              <img
                src="assets/img/3.png"
                class="d-block w-100"
                alt="Banner 3"
              />
            </div>
          </div>

          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#mainCarousel"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#mainCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </header>

      <nav class="navbar navbar-expand-lg bg-white border mt-0">
        <div class="container-fluid">
          <a
            class="navbar-brand d-flex align-items-center gap-2"
            href="index.html"
          >
            <img src="assets/img/logo.png" alt="Logo" width="30" height="30" />
            <span class="fw-bold text-primary">My Website</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="pages/home.html" target="main-content"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="pages/study.html"
                  target="main-content"
                  >MyStudy</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="pages/gallery.html"
                  target="main-content"
                  >Gallery</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="pages/datatables.html"
                  target="main-content"
                  >Datatable</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="pages/login.html"
                  target="main-content"
                  >Login</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="page-shell row g-0 mt-3">
        <aside class="col-lg-3 sidebar p-3">
          <h4>Content</h4>
          <div class="sidebar-links">
            <a
              href="https://nfacademy.id"
              target="_blank"
              rel="noopener noreferrer"
              >NF Academy</a
            >
            <a
              href="https://nurulfikri.ac.id"
              target="_blank"
              rel="noopener noreferrer"
              >Nurul Fikri</a
            >
            <a
              href="https://www.w3schools.com"
              target="_blank"
              rel="noopener noreferrer"
              >W3Schools</a
            >
            <a
              href="https://getbootstrap.com"
              target="_blank"
              rel="noopener noreferrer"
              >Bootstrap</a
            >
            <a
              href="https://www.youtube.com"
              target="_blank"
              rel="noopener noreferrer"
              >YouTube</a
            >
          </div>
        </aside>

        <section class="col-lg-9 content-area">
          <iframe
            id="main-content"
            name="main-content"
            src="pages/home.html"
            title="Main Content"
            style="width: 100%; min-height: 620px; border: 0; background: #fff"
          ></iframe>
        </section>
      </main>

      <footer class="mt-3">
        <div class="container">
          <div class="row align-items-center">
            <div class="col-md-6">
              <p class="mb-0">
                © 2026 My Website. Dibuat oleh Naufal Alfihusni.
              </p>
            </div>
            <div class="col-md-6 text-md-end social-icons">
              <a
                href="https://www.instagram.com/alfi_1215?stkn=MXJpdDFkYzA5ZThmcQ=="
                target="_blank"
                aria-label="Instagram"
              >
                <i class="fa-brands fa-instagram"></i>
              </a>
              <a
                href="https://www.facebook.com"
                target="_blank"
                aria-label="Facebook"
              >
                <i class="fa-brands fa-facebook"></i>
              </a>
              <a
                href="https://www.linkedin.com"
                target="_blank"
                aria-label="LinkedIn"
              >
                <i class="fa-brands fa-linkedin"></i>
              </a>
              <a
                href="https://github.com/Naufal-Alfihusni"
                target="_blank"
                aria-label="GitHub"
              >
                <i class="fa-brands fa-github"></i>
              </a>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
